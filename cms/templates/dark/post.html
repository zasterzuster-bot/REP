{% extends "base.html" %}
{% block content %}
<h1>{{ post.title }}</h1>
<p class="pm">{{ f('date', post.published_at) }} · {% for c in cats %}<a href="{{ f('url_cat', c) }}">{{ c.title }}</a> {% endfor %}</p>
<div class="body">{{ f('md', post.body) }}</div>
<p>{% for t in post.tags %}<a class="tag" href="/tag/{{ t }}">#{{ t }}</a> {% endfor %}</p>
{% endblock %}
